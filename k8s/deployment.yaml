apiVersion: apps/v1
kind: Deployment
metadata:
  name: carsales-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carsales-api
  template:
    metadata:
      labels:
        app: carsales-api
    spec:
      containers:
        - name: carsales-api
          image: carsales-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: carsales-config
            - secretRef:
                name: carsales-secrets
          readinessProbe:
            httpGet:
              path: /swagger-ui/index.html
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
