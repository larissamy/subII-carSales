services:
  carsales-api:
    build: .
    container_name: carsales-api
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      # SQLite in-memory (same as default application.yml)
      SPRING_DATASOURCE_URL: "jdbc:sqlite:file:memdb1?mode=memory&cache=shared"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
